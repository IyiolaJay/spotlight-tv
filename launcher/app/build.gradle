plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.iyiolajay.spotlight'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.iyiolajay.spotlight'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Release (not debuggable) so it runs at full speed; signed with the debug key so it installs over earlier builds
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
